spring.application.name=shipchandling

server.port = 8080
# server.servlet.context-path = /api/shipchandling


# --- DATABASE CONFIG ACTIVE ---
# Set Oracle as default,
# for oracle: java -jar 0.0.1-SNAPSHOT.jar
# use command line postgres for switching: java -jar 0.0.1-SNAPSHOT.jar --spring.profiles.active=postgres
spring.profiles.active=oracle

# Common Hikari settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=HikariPool-ASG

# --- JPA CONFIG ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- LOGGING ---
# Basic log levels
logging.level.root=INFO
logging.level.com.asg=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Log file
logging.file.name=logs/app.log

# Console format
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n