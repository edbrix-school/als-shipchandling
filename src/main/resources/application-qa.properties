spring.application.name=shipchandling

server.port = 9091
server.servlet.context-path = /shipchandling/api


# --- DATASOURCE CONFIG ---
spring.datasource.url=jdbc:oracle:thin:@//10.100.200.95:1521/ODAVADF.SHIPPINGBAHRAIN.COM
spring.datasource.username=QA_DB_USER
spring.datasource.password=QA_DB_USER_19C
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# --- JPA DIALECT ---
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# --- DEFAULT SCHEMA ---
spring.jpa.properties.hibernate.default_schema=QA_DB_USER

spring.jpa.properties.hibernate.cache.use_second_level_cache=false

# Common Hikari settings
# Reduced pool size to prevent ORA-12516: TNS:listener could not find available handler
# If you still get this error, reduce maximum-pool-size further or increase Oracle PROCESSES limit
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=HikariPool-ASG
# Connection validation
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL
spring.datasource.hikari.validation-timeout=5000
# Leak detection - reduced threshold to catch leaks faster (30 seconds)
spring.datasource.hikari.leak-detection-threshold=30000
# Keep connections alive
spring.datasource.hikari.keepalive-time=300000
# Register JMX beans for monitoring connection pool
spring.datasource.hikari.register-mbeans=true

# --- JPA CONFIG ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# --- LOGGING ---
# Basic log levels
logging.level.root=INFO
logging.level.com.asg=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Log file
logging.file.name=logs/app.log

# Console format
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n
