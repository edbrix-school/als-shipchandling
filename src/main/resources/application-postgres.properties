# --- DATASOURCE CONFIG ---
spring.datasource.url=jdbc:postgresql://10.100.200.131:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=Chase1234@
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA DIALECT ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- DEFAULT SCHEMA ---
spring.jpa.properties.hibernate.default_schema=production
spring.datasource.hikari.schema=production

# Oracle's SELECT 1 FROM DUAL (base properties) is not valid on Postgres
spring.datasource.hikari.connection-test-query=SELECT 1

# Activates isPostgres() branches in shared asg-common-lib classes
db.connection=postgres